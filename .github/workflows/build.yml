name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyusb numpy pyinstaller libusb-package wxPython

      - name: sign driver package (self-signed published catalog)
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate -Subject "CN=SeekNano Project" `
                   -Type CodeSigningCert -KeySpec Signature -KeyUsage DigitalSignature `
                   -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(10)
          New-FileCatalog -CatalogFilePath driver\seeknano.cat -Path driver -CatalogVersion 2
          Set-AuthenticodeSignature -FilePath driver\seeknano.cat -Certificate $cert -HashAlgorithm SHA256 -TimestampServer "http://timestamp.digicert.com"
          Export-Certificate -Cert $cert -FilePath driver\SeekNanoSigner.cer
          $thumb = $cert.Thumbprint
          echo "signerthumb=$thumb" >> $env:GITHUB_ENV
      - name: build libusb transport dll (cl)
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /W4 /LD transport\libusb\seeknanousb_libusb.c /Fe:seeknanodirect.dll /link kernel32.lib user32.lib
          if not exist seeknanodirect.dll exit 1
      - name: build native transport dll (cl)
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /W4 /LD transport\native\seeknanousb.c /Fe:seeknanousb.dll /link winusb.lib setupapi.lib user32.lib
          if not exist seeknanousb.dll exit 1
      - name: build libwdi installer
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/pbatard/libwdi.git libwdi-src
          for /f "usebackq delims=" %%i in (`vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          msbuild libwdi-src\libwdi\.msvc\embedder.vcxproj /p:Configuration=Release /p:Platform=Win32 /m
          msbuild libwdi-src\libwdi\.msvc\libwdi_static.vcxproj /p:Configuration=Release /p:Platform=x64 /m
          msbuild libwdi-src\examples\getopt\.msvc\getopt.vcxproj /p:Configuration=Release /p:Platform=x64 /m
          msbuild libwdi-src\examples\.msvc\wdi-simple.vcxproj /p:Configuration=Release /p:Platform=x64 /p:BuildProjectReferences=false /m
          dir /s /b libwdi-src\*wdi-simple.exe
          for /f "delims=" %%f in ('dir /s /b libwdi-src\*wdi-simple.exe') do copy /y "%%f" driver\wdi-simple.exe
          if not exist driver\wdi-simple.exe exit 1
      - name: build driver installer (csc)
        shell: powershell
        run: |
          & C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe /nologo /out:driver/SeekNanoDriverInstaller.exe /win32manifest:driver\\admin.manifest driver\\installer.cs
      - name: copy bundled libusb-1.0.dll
        shell: bash
        run: |
          python -c "import libusb_package, shutil, os; shutil.copy2(os.path.join(os.path.dirname(libusb_package.__file__), 'libusb-1.0.dll'), '.')"
          ls -la libusb-1.0.dll
      - name: build exe
        run: |
          pyinstaller --onefile --windowed --name SeekNano `
            --add-binary "libusb-1.0.dll;." `
            --add-binary "seeknanodirect.dll;." `
            --add-binary "seeknanousb.dll;." `
            --collect-all libusb_package `
            --hidden-import usb.backend.libusb10 `
            app/viewer.py
        shell: powershell

      - name: upload release
        run: |        
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v*) ;; *) TAG="v0.2.0-manual";; esac
          EXE_FILE=$(ls dist/*.exe | head -1)
          rm -f driver/install.ps1 driver/installer.cs && 7z a -tzip SeekNano-driver.zip ./driver/* seeknanousb.dll
          gh release create "$TAG" "$EXE_FILE" SeekNano-driver.zip --repo "$GITHUB_REPOSITORY" \
            --title "Seek Nano Viewer $TAG" \
            --notes "Download, run, plug the Nano in. First-time Windows driver step: run SeekNanoDriverInstaller.exe (Device-Manager fallback described in app/README.md)." || \
            gh release upload "$TAG" "$EXE_FILE" SeekNano-driver.zip --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
