name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyusb numpy pyinstaller libusb-package wxPython

      - name: build exe
        run: |
          pyinstaller --onefile --windowed --name SeekNano `
            --collect-all libusb_package `
            --hidden-import usb.backend.libusb10 `
            app/viewer.py
        shell: powershell

      - name: upload release
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v*) ;; *) TAG="v0.2.0-manual";; esac
          EXE_FILE=$(ls dist/*.exe | head -1)
          gh release create "$TAG" "$EXE_FILE" --repo "$GITHUB_REPOSITORY" \
            --title "Seek Nano Viewer $TAG" \
            --notes "Download, run, plug the Nano in. First-time Windows driver step: install the libusb-win32/WinUSB driver with Zadig (see README)." || \
            gh release upload "$TAG" "$EXE_FILE" --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
