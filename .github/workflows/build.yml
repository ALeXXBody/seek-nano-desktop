name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyusb opencv-python numpy pyinstaller py7zr

      - name: fetch libusb-1.0.dll
        run: |
          curl -L -o libusb.7z https://github.com/libusb/libusb/releases/download/v1.0.28/libusb-1.0.28.7z
          python -m py7zr x libusb.7z libusb
          cp libusb/VS2019/x64/Release/dll/libusb-1.0.dll .
        shell: bash

      - name: build exe
        run: |
          pyinstaller --onefile --windowed --name SeekNano `
            --add-binary "libusb-1.0.dll;." `
            --hidden-import usb.backend.libusb10 `
            app/viewer.py
        shell: powershell

      - name: upload artifact + release
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notlike "v*") { $tag = "v0.2.0-manual" }
          gh release create "$tag" dist/SeekNano.exe --repo ${{ github.repository }} `
            --title "Seek Nano Viewer $tag" `
            --notes "Download, run, plug the Nano in. First-time Windows driver step: install the libusb-win32/WinUSB driver with Zadig (see README)." || gh release upload "$tag" dist/SeekNano.exe --repo ${{ github.repository }} --clobber
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
